<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Welcome page</title>

    <link rel="stylesheet" href="../cssfiles/login.css">
</head>
<body>

<form id="signinForm" onsubmit="return scr()">

    <div class="login-container">

        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to continue to your dashboard</p>
        <span id="invalidError" class="error  inv"></span>

        <label>Email Address:</label>
        <input type="email" id="email" placeholder="Enter your email address">
        <span id="emailError" class="error"></span>

        <label>Password:</label>
        <input type="password" id="password" placeholder="Enter your password">
        <span id="passwordError" class="error"></span>
        

        <p class="password-note">
            Password must be at least 8 characters long.
        </p>

        <div class="options">

            <label class="remember">
                <input type="checkbox" id="terms">
                Remember me for 30 days
            </label>

            <a href="#">Forgot password?</a>

        </div>
        <span id="termsError" class="error"></span>

        <button type="submit" id="signinBtn" window.location.href="./dashboard.html">Sign In</button>

        <p class="signup">
            New to WebTech Practice?
            <a href="./signup.html">Create an account</a>
        </p>

    </div>

</form>

<script src="../jsfiles/login.js"></script>

</body>
</html>
